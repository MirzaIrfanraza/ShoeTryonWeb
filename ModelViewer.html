<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Future Footwear | 3D View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="css/viewer-style.css">
</head>

<body>

    <model-viewer src="./3D/Shoe.glb" ios-src="./3D/Shoe.usdz" camera-controls auto-rotate shadow-intensity="1"
        disable-pan tone-mapping="neutral" interaction-prompt="auto">
    </model-viewer>

    <div id="qr-container">
        <button id="close-qr"
            style="position:absolute; top:5px; right:10px; background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
        <img id="qr-code" alt="Scan for AR">
        <div id="qr-label">
            <p style="margin: 0; font-size: 16px; font-weight: bold;">Experience in Augmented Reality</p>
            <p style="margin: 5px 0 0 0; font-size: 14px; font-weight: normal; color: #555;">Scan this QR code with your
                mobile camera or QR scanner app.</p>
        </div>
    </div>

    <button id="ar-button" class="ar-button">Virtual Try On</button>

    <script src="js/viewer-logic.js" defer></script>

</body>

</html>
